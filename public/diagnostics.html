<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minbar browser verification</title><link rel="stylesheet" href="/styles.css"><main class="shell"><h1>Browser verification</h1><p>A labelled test of the real WebRTC transcription, audio relay and GPT-Transcribe double-check. Recordings selected here go to the configured transcription provider. This test does not archive audio.</p><div class="panel"><label for="host">Host access key</label><input id="host" type="password" autocomplete="off"><label for="keyfile">Or load a local host-key file</label><input id="keyfile" type="file" accept="text/plain"><label for="language">Spoken language</label><select id="language"><option value="ar">Arabic</option><option value="en">English</option></select><label for="audio">Prerecorded test audio (optional)</label><input id="audio" type="file" accept="audio/*"><p>Leave the audio file empty to test the microphone.</p><button id="start" class="primary">Start browser test</button><button id="stop" class="secondary" disabled>Stop test</button><p><a id="listener" hidden target="_blank" rel="noopener">Open attendee room</a></p><p id="status" role="status">Ready</p><pre id="result" style="white-space:pre-wrap"></pre></div></main><script type="module" src="/diagnostics.js"></script></html>
