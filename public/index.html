<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Minbar</title>
  <script>
    // Old links: /?room=ID&as=imam|screen|listen -> the dedicated pages.
    (function () {
      var p = new URLSearchParams(location.search), room = p.get('room');
      if (!room) return;
      var as = p.get('as'), page = as === 'imam' || as === 'khatib' ? 'khatib' : as === 'screen' ? 'screen' : 'listen';
      p.delete('as');
      location.replace('/' + page + '.html?' + p.toString());
    })();
  </script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=IBM+Plex+Sans:wght@400;600&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
</head>
<body class="home">
  <header class="container home-top">
    <span class="spacer"></span>
    <button type="button" class="btn btn-quiet" id="ui-lang" data-i18n-aria-label="ui_language"></button>
  </header>

  <main class="container home-main">
    <section class="intro">
      <h1 data-i18n="app_name">Minbar</h1>
      <p class="lede muted" data-i18n="tagline">Live khutbah captions in every language.</p>
    </section>

    <div class="home-grid">
      <section class="home-start" aria-labelledby="start-h">
        <h2 id="start-h" data-i18n="start_khutbah">Start a khutbah</h2>
        <form id="start-form" class="stack" novalidate>
          <div class="field">
            <label class="label" for="title" data-i18n="khutbah_title">Title</label>
            <input class="input" id="title" name="title" maxlength="120" autocomplete="off" data-i18n-placeholder="khutbah_title_placeholder">
          </div>
          <fieldset class="field">
            <legend class="label" data-i18n="spoken_language">Spoken language</legend>
            <div class="seg" id="source-options"></div>
          </fieldset>
          <fieldset class="field">
            <legend class="label" data-i18n="target_languages">Translate to</legend>
            <div class="chips" id="target-options"></div>
          </fieldset>
          <fieldset class="field">
            <legend class="label" data-i18n="visibility">Access</legend>
            <div class="seg" id="visibility-options"></div>
          </fieldset>
          <p class="error-text" id="start-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="start-submit" data-i18n="create_room">Start</button>
        </form>
      </section>

      <section class="home-side" aria-labelledby="join-h">
        <h2 id="join-h" data-i18n="join_by_code">Join with code</h2>
        <form id="join-form" class="row nowrap" novalidate>
          <label class="visually-hidden" for="join-code" data-i18n="room_code">Room code</label>
          <input class="input code-input" id="join-code" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr" data-i18n-placeholder="join_code_placeholder">
          <button type="submit" class="btn" id="join-submit" data-i18n="join">Join</button>
        </form>
        <p class="error-text" id="join-error" role="alert" hidden></p>
        <p class="demo-line"><button type="button" class="link-btn" id="demo-btn" data-i18n="try_demo">Try the demo</button></p>
        <p class="error-text" id="demo-error" role="alert" hidden></p>
      </section>
    </div>

    <section class="recent" id="recent" aria-labelledby="recent-h" hidden>
      <h2 id="recent-h" data-i18n="recent_rooms">Recent</h2>
      <ul class="recent-list" id="recent-list"></ul>
    </section>
  </main>

  <footer class="container home-footer">
    <p class="fineprint" data-i18n="disclaimer">Transcripts and translations can be wrong. Verify Quran and hadith references.</p>
  </footer>
  <script type="module" src="/js/home.mjs"></script>
</body>
</html>
